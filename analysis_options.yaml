include: package:flutter_lints/flutter.yaml

analyzer:
  exclude:
    # Cargokit — отдельный пакет Dart со своими зависимостями (сборка ядра).
    - rust_builder/**
    - tool/**
    # Сборка и каталоги платформ (их создаёт tool/bootstrap.py).
    - build/**
    - android/**
    - ios/**
    - macos/**
    - windows/**
    - linux/**

linter:
  rules:
    prefer_single_quotes: true
    always_declare_return_types: true
