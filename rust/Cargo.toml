[package]
name = "ogneliss_core"
version = "0.1.0"
edition = "2024"
rust-version = "1.91"
license = "Apache-2.0"
description = "Ядро Ogneliss Share: прямые зашифрованные передачи файлов между устройствами"
repository = "https://github.com/oedante/OgnelissShare"
publish = false

[lib]
name = "ogneliss_core"
# cdylib — Android, Windows, Linux; staticlib — iOS и macOS (через CocoaPods);
# rlib — тесты на машине разработчика.
crate-type = ["cdylib", "staticlib", "rlib"]

[dependencies]
# Соединения QUIC по открытому ключу устройства: пробивка NAT, запасной
# ретранслятор, шифрование TLS 1.3 со взаимной проверкой ключей.
iroh = { version = "1.4", default-features = false, features = ["tls-ring", "portmapper"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "fs", "io-util", "net"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Хеш каждого файла: целостность и проверка после докачки.
blake3 = "1"
rand = "0.10"
data-encoding = "2"
anyhow = "1"
# Отмена передач.
tokio-util = "0.7"
fs4 = "1"

# WebRTC для раздачи файлов в браузер (rtc.rs). str0m — без собственного
# криптопровайдера: его `rust-crypto` через dimpl/rcgen тянет aws-lc-sys,
# а тот плохо собирается под Android и iOS. Вместо него в rtc.rs свой
# провайдер: DTLS — dimpl на RustCrypto, сертификат — rcgen поверх ring
# (ring уже нужен iroh), SRTP не используется (только DataChannel).
str0m = { version = "0.24", default-features = false }
dimpl = { version = "0.7", default-features = false, features = ["rust-crypto"] }
rcgen = { version = "0.14", default-features = false, features = ["crypto", "ring"] }
hmac = "0.12"
sha1 = "0.10"
sha2 = "0.10"
# Сообщения через службу связи шифруются AES-256-GCM.
aes-gcm = "0.10"
# HTTPS к службе связи: тот же rustls (ring), что и у iroh; корни — webpki-roots.
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider"] }

# Поиск устройств в локальной сети без интернета. На iOS не подключаем:
# сырой multicast там требует отдельного разрешения Apple
# (com.apple.developer.networking.multicast).
[target.'cfg(not(target_os = "ios"))'.dependencies]
iroh-mdns-address-lookup = "0.6"

# Android: передать ядру JavaVM для чтения DNS текущей сети.
[target.'cfg(target_os = "android")'.dependencies]
jni-sys = "0.3"

# iOS: netdev 0.46 (его тянет iroh 1.4) не собирается с libc ≥ 0.2.190 —
# там тип in6_ifreq оставили только для macOS. Исправлено в netdev 0.47;
# когда iroh перейдёт на неё, ограничение убрать.
[target.'cfg(target_os = "ios")'.dependencies]
libc = ">=0.2.180, <0.2.190"

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "fs", "io-util", "net", "test-util"] }
# Тест HTTPS-клиента rtc.rs: локальный сервер с самоподписанным сертификатом (только ring).
tokio-rustls = { version = "0.26", default-features = false, features = ["ring"] }

[profile.release]
# Размер важен для мобильных: оптимизация по размеру, полная LTO, без
# локальных символов. Экспорт osh_* сохраняется (динамическая таблица),
# а статическая библиотека для iOS и macOS strip не затрагивает.
opt-level = "s"
lto = "fat"
codegen-units = 1
strip = "symbols"

# Горячие места передачи — с полной оптимизацией по скорости.
[profile.release.package.blake3]
opt-level = 3
[profile.release.package.noq-proto]
opt-level = 3
[profile.release.package.noq-udp]
opt-level = 3
[profile.release.package.noq]
opt-level = 3
[profile.release.package.rustls]
opt-level = 3
