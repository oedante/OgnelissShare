name: ogneliss_share
description: "Ogneliss Share — прямая передача файлов между своими устройствами без учётных записей"
publish_to: "none"
version: 0.1.1+2

environment:
  # Dart 3.10+ и Flutter 3.38+: этого требует file_picker 13.
  sdk: ">=3.10.0 <4.0.0"
  flutter: ">=3.38.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  # Даты и числа по правилам языка; версию задаёт flutter_localizations.
  intl: any
  # Ядро на Rust (rust/), собирается Cargokit для каждой платформы.
  ogneliss_core:
    path: rust_builder
  ffi: ^2.1.3
  path: ^1.9.0
  path_provider: ^2.1.4
  # 13.x: методы статические, PlatformFile — абстрактный (API с 12-й версии).
  file_picker: ^13.1.0
  # QR-коды: сканер (камера Android, iOS, macOS) и рисование кода.
  mobile_scanner: ^7.1.0
  qr_flutter: ^4.1.0
  # Открыть полученный файл на телефоне; на компьютере — url_launcher.
  open_filex: ^4.3.4
  url_launcher: ^6.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  # Классы локализации из lib/l10n/*.arb (см. l10n.yaml).
  generate: true
  assets:
    - assets/brand/mark.png
    - assets/licenses/rust.json
