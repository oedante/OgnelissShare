# ═══════════════════════════════════════════════════════════════════════
# Ogneliss Share на ogneliss.ru — добавить в Nginx Proxy Manager: хост
# ogneliss.ru → Edit → Advanced → Custom Nginx Configuration, рядом с
# разделом «Ogneliss NumTouch» (переменные $docs и $ogn_lang заданы там же,
# в начале файла nginx-landing.conf). Файлы — содержимое site/out/ этого
# репозитория в корне контейнера статики (share/…, ru/share/…).
#
# /share/join/ — страница ссылок-приглашений из приложения
# (https://ogneliss.ru/share/join/#…). Часть после «#» браузер на сервер не
# отправляет и при переадресации на русскую страницу сохраняет сам.
# /share/get/ — страница получателя файлов в браузере (https://ogneliss.ru/share/get/#…,
# docs/WEB_P2P.md); устроена так же, как /share/join/: «#…» браузер сохраняет при любых
# переадресациях. Запросы страницы к службе связи (/share/api/v1/…) идут не в статику, а в
# службу — для них отдельное правило, server/signal/nginx-signal.conf.
# Языков у Share два: русский и английский — поэтому переадресация только на ru.
# ═══════════════════════════════════════════════════════════════════════

location = /share { return 301 /share/; }

location = /share/ {
    if ($ogn_lang = ru) { return 302 /share/ru/; }
    proxy_pass http://$docs/share/index.html;
    proxy_set_header Host $host;
}
location = /share/privacy {
    if ($ogn_lang = ru) { return 302 /share/ru/privacy; }
    proxy_pass http://$docs/share/privacy.html;
    proxy_set_header Host $host;
}
location = /share/join { return 301 /share/join/; }
location = /share/join/ {
    if ($ogn_lang = ru) { return 302 /share/ru/join/; }
    proxy_pass http://$docs/share/join.html;
    proxy_set_header Host $host;
}
location = /share/get { return 301 /share/get/; }
location = /share/get/ {
    if ($ogn_lang = ru) { return 302 /share/ru/get/; }
    proxy_pass http://$docs/share/get.html;
    proxy_set_header Host $host;
}

location = /share/ru                 { return 301 /share/ru/; }
location = /share/ru/                { proxy_pass http://$docs/ru/share/index.html; proxy_set_header Host $host; }
location = /share/ru/privacy         { proxy_pass http://$docs/ru/share/privacy.html; proxy_set_header Host $host; }
location ~ ^/share/ru/join/?$        { proxy_pass http://$docs/ru/share/join.html; proxy_set_header Host $host; }
location ~ ^/share/ru/get/?$         { proxy_pass http://$docs/ru/share/get.html; proxy_set_header Host $host; }

# Значки страницы
location /share/ {
    proxy_pass http://$docs;
    proxy_set_header Host $host;
}

# Android App Links: ссылки-приглашения сразу в приложении. Файл
# assetlinks.json положить в корень статики, когда будут отпечатки ключей
# из Play Console (docs/RELEASE.md, раздел 3). Пока файла нет — 404, ссылки
# открывают страницу /share/join/.
location = /.well-known/assetlinks.json {
    default_type application/json;
    proxy_pass http://$docs/assetlinks.json;
    proxy_set_header Host $host;
}
