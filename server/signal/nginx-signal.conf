# ═══════════════════════════════════════════════════════════════════════
# Служба связи Ogneliss Share на ogneliss.ru — добавить в Nginx Proxy Manager:
# хост ogneliss.ru → Edit → Advanced → Custom Nginx Configuration, рядом с
# разделом «Ogneliss Share» (site/nginx-share.conf). Контейнер службы
# (server/signal/) должен быть в той же сети Docker, что и сам NPM, под
# именем ogneliss-signal, порт 8080.
#
# Страницы /share/… (HTML) отдаёт контейнер статики, а /share/api/ — только
# служба связи. Более длинный префикс побеждает: этот блок важнее общего
# «location /share/» из nginx-share.conf, порядок записи не имеет значения.
# Ответы службы сами идут с Cache-Control: no-store, добавлять его не нужно.
# ═══════════════════════════════════════════════════════════════════════

location ^~ /share/api/ {
    # Адрес службы берётся в переменной и разрешается при каждом запросе через
    # встроенный DNS Docker. Если написать proxy_pass http://ogneliss-signal:8080
    # прямо, то при остановленном контейнере nginx не запустится вовсе («host
    # not found in upstream») и положит все сайты за NPM, а не только этот.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $signal_upstream ogneliss-signal:8080;
    # Без части с адресом после $signal_upstream запрос уходит как есть:
    # /share/api/v1/… → /share/api/v1/… (служба сама знает этот префикс).
    proxy_pass http://$signal_upstream;

    # Настоящий адрес клиента: служба по нему ограничивает частоту запросов.
    # X-Real-IP выставляет сам nginx, подделать его клиент не может. Порт
    # 8080 наружу не публикуем, иначе заголовки можно было бы слать напрямую.
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header Host $host;

    # Долгий опрос держит запрос до 30 секунд, поэтому чтение ответа ждём
    # дольше; буферизация выключена, чтобы ответ уходил сразу, как готов.
    proxy_read_timeout 40s;
    proxy_buffering off;

    # Соединения к службе держим открытыми (HTTP/1.1 без «Connection: close»).
    proxy_http_version 1.1;
    proxy_set_header Connection "";

    # Тела запросов службы ≤ 16 КиБ (она сама отвечает 413); здесь — запас
    # на заголовки JSON, чтобы nginx не отсекал раньше.
    client_max_body_size 20k;
}
