# Служба связи Ogneliss Share рядом с Nginx Proxy Manager (NPM).
# Скопировать в docker-compose.yml и запустить из этого каталога:
#   docker compose up -d --build
#
# Порт наружу НЕ публикуется: NPM обращается к службе по имени контейнера
# (http://ogneliss-signal:8080) через общую сеть Docker. Поэтому служба
# должна быть в той же сети, что и NPM.

services:
  ogneliss-signal:
    build: .
    image: ogneliss-signal
    container_name: ogneliss-signal
    restart: unless-stopped
    environment:
      LISTEN: "0.0.0.0:8080"
    networks: [npm]

    # Служба ничего не пишет на диск и ничего не хранит, кроме памяти.
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 64m
    pids_limit: 128
    # Журнал только короткий: по строке на создание и удаление комнаты.
    # Лимит размера не даёт ему расти бесконечно.
    logging:
      driver: json-file
      options:
        max-size: "1m"
        max-file: "3"

networks:
  npm:
    # npm_default — заглушка. Настоящее имя сети NPM смотреть так:
    #   docker network ls
    # Нужна сеть, в которой стоит контейнер NPM; обычно это «<каталог с NPM>_default».
    # Проверить точно:
    #   docker inspect -f '{{json .NetworkSettings.Networks}}' <имя контейнера NPM>
    # Подставить найденное имя вместо npm_default.
    name: npm_default
    external: true
