# Проверка и сборка Ogneliss Share на GitHub.
#
#  · Ядро (Rust): тесты на двух-трёх узлах в одном процессе и clippy.
#  · Dart: каталоги платформ (tool/bootstrap.py → flutter create + накладка),
#    flutter analyze, flutter test.
#  · Сборки: Android (APK по архитектурам), Linux, Windows, macOS, iOS (без
#    подписи). Результаты — в «Artifacts» запуска (14 дней) и в Releases:
#      – новая версия в pubspec.yaml (метки v<версия> ещё нет) или метка v* —
#        выпуск «Ogneliss Share <версия>»;
#      – остальные изменения main — предварительный выпуск «Тестовая сборка»
#        (метка nightly, файлы заменяются). Имена файлов постоянные, поэтому
#        ссылки …/releases/latest/download/<файл> всегда ведут на последнюю версию.
#  · Сводка: итоги задач и хвосты журналов кладутся в ветку ci-status
#    (только этот каталог, без кода) — чтобы разбирать ошибки сборки без
#    доступа к интерфейсу Actions. Ветку можно удалить в любой момент.
#
# Ретрансляторы — общедоступные n0. На будущее можно собрать со своими:
# Settings → Secrets and variables → Actions → Variables → OGNELISS_RELAYS
# (адреса через запятую, см. docs/RELAY.md). Сейчас не используется.
# Подпись Android: секреты ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD,
# ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD; без них — отладочный ключ.

name: CI

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  OGNELISS_RELAYS: ${{ vars.OGNELISS_RELAYS }}
  CARGO_TERM_COLOR: never
  # Русские сообщения скриптов в консоли Windows.
  PYTHONUTF8: '1'

defaults:
  run:
    shell: bash

jobs:
  core:
    name: Ядро (Rust)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
      - name: Rust stable
        run: rustup update stable && rustup default stable && rustup component add clippy
      - name: Тесты
        working-directory: rust
        run: |
          mkdir -p ../ci-logs
          cargo test 2>&1 | tee ../ci-logs/core.log
      - name: Clippy
        working-directory: rust
        run: cargo clippy --all-targets 2>&1 | tee -a ../ci-logs/core.log
      - uses: actions/upload-artifact@v4
        if: ${{ always() }}
        with:
          name: log-core
          path: ci-logs/
          retention-days: 7

  dart:
    name: Dart (анализ и тесты)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Каталоги платформ
        run: |
          mkdir -p ci-logs
          flutter --version 2>&1 | tee ci-logs/dart.log
          python tool/bootstrap.py 2>&1 | tee -a ci-logs/dart.log
      - name: Анализ
        run: flutter analyze --no-fatal-infos 2>&1 | tee ci-logs/analyze.log
      - name: Тесты
        if: ${{ !cancelled() }}
        run: flutter test 2>&1 | tee ci-logs/test.log
      - uses: actions/upload-artifact@v4
        if: ${{ always() }}
        with:
          name: log-dart
          path: ci-logs/
          retention-days: 7

  android:
    name: Android
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '21'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Rust stable
        run: rustup update stable && rustup default stable
      - name: Каталоги платформ
        run: |
          mkdir -p ci-logs
          python tool/bootstrap.py 2>&1 | tee ci-logs/android.log
      - name: Ключ подписи (если задан)
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "$KS_B64" ]; then
            echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/upload-keystore.jks"
            {
              echo "storeFile=$RUNNER_TEMP/upload-keystore.jks"
              echo "storePassword=$KS_PASS"
              echo "keyAlias=$KEY_ALIAS"
              echo "keyPassword=$KEY_PASS"
            } > android/key.properties
            echo "Подпись: ключ из секретов"
          else
            echo "::notice title=Отладочная подпись::Секретов ключа нет — APK подписан отладочным ключом (для проверки, не для магазинов)"
          fi
      - name: Сборка APK
        run: |
          flutter build apk --release --split-per-abi 2>&1 | tee -a ci-logs/android.log
          # Из чего состоит APK — чтобы следить за размером.
          unzip -lv build/app/outputs/flutter-apk/app-arm64-v8a-release.apk \
            | sort -k1 -n | tail -n 12 | tee -a ci-logs/android.log
      - name: Убрать ключ
        if: ${{ always() }}
        run: rm -f android/key.properties "$RUNNER_TEMP/upload-keystore.jks"
      - uses: actions/upload-artifact@v4
        with:
          name: ogneliss-share-android
          path: build/app/outputs/flutter-apk/*-release.apk
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: ${{ always() }}
        with:
          name: log-android
          path: ci-logs/
          retention-days: 7

  linux:
    name: Linux
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Rust stable
        run: rustup update stable && rustup default stable
      - name: Системные пакеты
        run: |
          sudo apt-get update -y
          sudo apt-get install -y ninja-build libgtk-3-dev clang cmake pkg-config liblzma-dev libstdc++-12-dev
      - name: Каталоги платформ
        run: |
          mkdir -p ci-logs
          python tool/bootstrap.py 2>&1 | tee ci-logs/linux.log
      - name: Сборка
        run: flutter build linux --release 2>&1 | tee -a ci-logs/linux.log
      - name: Архив
        run: tar -czf ogneliss-share-linux-x64.tar.gz -C build/linux/x64/release bundle
      - uses: actions/upload-artifact@v4
        with:
          name: ogneliss-share-linux
          path: ogneliss-share-linux-x64.tar.gz
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: ${{ always() }}
        with:
          name: log-linux
          path: ci-logs/
          retention-days: 7

  windows:
    name: Windows
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Rust stable
        run: rustup update stable && rustup default stable
      - name: Каталоги платформ
        run: |
          mkdir -p ci-logs
          python tool/bootstrap.py 2>&1 | tee ci-logs/windows.log
      - name: Сборка
        run: flutter build windows --release 2>&1 | tee -a ci-logs/windows.log
      - uses: actions/upload-artifact@v4
        with:
          name: ogneliss-share-windows
          path: build/windows/x64/runner/Release/
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: ${{ always() }}
        with:
          name: log-windows
          path: ci-logs/
          retention-days: 7

  macos:
    name: macOS
    runs-on: macos-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Rust stable
        run: rustup update stable && rustup default stable
      - name: Каталоги платформ
        run: |
          mkdir -p ci-logs
          python tool/bootstrap.py 2>&1 | tee ci-logs/macos.log
      - name: Сборка
        run: flutter build macos --release 2>&1 | tee -a ci-logs/macos.log
      - name: Подробности ошибки ядра
        # Xcode показывает от сборки Rust только последнюю строку — здесь полный текст.
        if: ${{ failure() }}
        working-directory: rust
        run: cargo build --release --target aarch64-apple-darwin 2>&1 | tail -n 200 | tee -a ../ci-logs/macos.log || true
      - name: Архив
        run: |
          ditto -c -k --sequesterRsrc --keepParent \
            "build/macos/Build/Products/Release/Ogneliss Share.app" ogneliss-share-macos.zip
      - uses: actions/upload-artifact@v4
        with:
          name: ogneliss-share-macos
          path: ogneliss-share-macos.zip
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: ${{ always() }}
        with:
          name: log-macos
          path: ci-logs/
          retention-days: 7

  ios:
    name: iOS (без подписи)
    runs-on: macos-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Rust stable
        run: rustup update stable && rustup default stable
      - name: Каталоги платформ
        run: |
          mkdir -p ci-logs
          python tool/bootstrap.py 2>&1 | tee ci-logs/ios.log
      - name: Сборка
        run: flutter build ios --release --no-codesign 2>&1 | tee -a ci-logs/ios.log
      - name: Подробности ошибки ядра
        # Xcode показывает от сборки Rust только последнюю строку — здесь полный текст.
        if: ${{ failure() }}
        working-directory: rust
        run: |
          rustup target add aarch64-apple-ios
          cargo build --release --target aarch64-apple-ios 2>&1 | tail -n 200 | tee -a ../ci-logs/ios.log || true
      - name: Архив
        run: |
          mkdir -p Payload
          cp -R build/ios/iphoneos/Runner.app Payload/
          zip -qry ogneliss-share-ios-unsigned.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: ogneliss-share-ios-unsigned
          path: ogneliss-share-ios-unsigned.ipa
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: ${{ always() }}
        with:
          name: log-ios
          path: ci-logs/
          retention-days: 7

  release:
    name: Выпуск
    if: ${{ github.event_name == 'push' && (startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/main') }}
    needs: [core, dart, android, linux, windows, macos, ios]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Что выпускаем
        id: what
        run: |
          version=$(sed -n 's/^version: *\([0-9][0-9.]*\).*/\1/p' pubspec.yaml)
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            tag="$GITHUB_REF_NAME"; kind=version
          elif git ls-remote --exit-code --tags origin "refs/tags/v$version" > /dev/null; then
            tag=nightly; kind=nightly
          else
            tag="v$version"; kind=version
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "kind=$kind" >> "$GITHUB_OUTPUT"
          echo "Выпуск: $tag ($kind)"
      - uses: actions/download-artifact@v4
        with:
          pattern: ogneliss-share-*
          path: dist
      - name: Файлы выпуска
        run: |
          mkdir -p out
          apk=dist/ogneliss-share-android
          cp "$apk/app-arm64-v8a-release.apk" out/ogneliss-share-android-arm64.apk
          cp "$apk/app-armeabi-v7a-release.apk" out/ogneliss-share-android-armv7.apk
          cp "$apk/app-x86_64-release.apk" out/ogneliss-share-android-x86_64.apk
          cp dist/ogneliss-share-linux/ogneliss-share-linux-x64.tar.gz out/
          cp dist/ogneliss-share-macos/ogneliss-share-macos.zip out/
          cp dist/ogneliss-share-ios-unsigned/ogneliss-share-ios-unsigned.ipa out/
          (cd dist/ogneliss-share-windows && zip -qry ../../out/ogneliss-share-windows-x64.zip .)
          (cd out && sha256sum * > SHA256SUMS.txt)
          ls -la out
      - name: Описание тестовой сборки
        if: ${{ steps.what.outputs.kind == 'nightly' }}
        run: |
          {
            echo "Сборка с ветки main: ${GITHUB_SHA::7} от $(date -u '+%d.%m.%Y %H:%M') UTC."
            echo
            echo "Для проверки: может быть нестабильной. Android — ogneliss-share-android-arm64.apk"
            echo "(старые 32-битные телефоны — armv7), Windows — ogneliss-share-windows-x64.zip"
            echo "(распакуйте и запустите ogneliss_share.exe). macOS и iOS — без подписи."
            echo
            echo "A test build from main: may be unstable. macOS and iOS builds are unsigned."
          } > notes.md
          # Метка nightly — на этот коммит (выпуск обновляется на месте).
          git tag -f nightly "$GITHUB_SHA"
          git push -f origin refs/tags/nightly
      - uses: softprops/action-gh-release@v2
        if: ${{ steps.what.outputs.kind == 'nightly' }}
        with:
          tag_name: nightly
          name: Тестовая сборка · test build
          body_path: notes.md
          prerelease: true
          make_latest: false
          files: out/*
      - uses: softprops/action-gh-release@v2
        if: ${{ steps.what.outputs.kind == 'version' }}
        with:
          tag_name: ${{ steps.what.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: Ogneliss Share ${{ steps.what.outputs.version }}
          make_latest: true
          generate_release_notes: true
          files: out/*

  report:
    name: Сводка (ветка ci-status)
    if: ${{ !cancelled() && github.event_name != 'pull_request' }}
    needs: [core, dart, android, linux, windows, macos, ios]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: log-*
          path: logs
      - name: Опубликовать сводку
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          R_CORE: ${{ needs.core.result }}
          R_DART: ${{ needs.dart.result }}
          R_ANDROID: ${{ needs.android.result }}
          R_LINUX: ${{ needs.linux.result }}
          R_WINDOWS: ${{ needs.windows.result }}
          R_MACOS: ${{ needs.macos.result }}
          R_IOS: ${{ needs.ios.result }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          mkdir -p out
          if [ -d logs ]; then
            for d in logs/*/; do
              name=$(basename "$d")
              mkdir -p "out/$name"
              for f in "$d"*; do
                [ -f "$f" ] || continue
                base=$(basename "$f")
                tail -n 3000 "$f" > "out/$name/$base"
                grep -nE "error|Error|ERROR|FAILED|failed|Exception|warning •|info •" "$f" \
                  | head -n 400 > "out/$name/${base%.log}.errors.txt" || true
              done
            done
          fi
          {
            echo "commit: $GITHUB_SHA"
            echo "ref: $GITHUB_REF_NAME"
            echo "run: $RUN_URL"
            echo "core: $R_CORE"
            echo "dart: $R_DART"
            echo "android: $R_ANDROID"
            echo "linux: $R_LINUX"
            echo "windows: $R_WINDOWS"
            echo "macos: $R_MACOS"
            echo "ios: $R_IOS"
          } > out/SUMMARY.txt
          cat out/SUMMARY.txt
          cd out
          git init -q
          git checkout -q -b ci-status
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "CI ${GITHUB_SHA::7} ($GITHUB_REF_NAME)"
          git push -q -f "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:ci-status
