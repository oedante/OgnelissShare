# Выпуск в Google Play из GitHub: Actions → «Google Play» → Run workflow.
#
# Собирает AAB (tool/release/build.py android) и загружает его на выбранную
# дорожку (tool/release/play.py) с заметками из store/whats_new/<версия>.txt.
# Нужны секреты репозитория (Settings → Secrets and variables → Actions):
#   ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS,
#   ANDROID_KEY_PASSWORD — ключ загрузки (тот же, что подписывает сборки CI);
#   PLAY_SERVICE_ACCOUNT_JSON — ключ сервисного аккаунта Google Play.
# Как их получить — docs/RELEASE.md. Первую сборку Google Play требует
# загрузить вручную в Play Console; дальше — отсюда.
#
# iOS и macOS — codemagic.yaml (облако Codemagic) или tool/release/testflight.sh
# на Mac; Microsoft Store — пакет MSIX из обычного CI (store-windows-msix).

name: Google Play

on:
  workflow_dispatch:
    inputs:
      track:
        description: 'Дорожка: internal — внутреннее тестирование, alpha — закрытое, beta — открытое'
        type: choice
        default: internal
        options: [internal, alpha, beta]
      listing:
        description: 'Обновить и карточку: тексты из store/play, значок и баннер'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: google-play
  cancel-in-progress: false

env:
  PYTHONUTF8: '1'

jobs:
  play:
    name: Сборка и загрузка
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Секреты на месте
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          PLAY_KEY: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          [ -n "$KS_B64" ] || { echo "::error::Нет секрета ANDROID_KEYSTORE_BASE64 — сборку с отладочной подписью Google Play не примет"; exit 1; }
          [ -n "$PLAY_KEY" ] || { echo "::error::Нет секрета PLAY_SERVICE_ACCOUNT_JSON (docs/RELEASE.md)"; exit 1; }
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '21'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Rust stable
        run: rustup update stable && rustup default stable
      - name: Каталоги платформ
        run: python tool/bootstrap.py
      - name: Ключ подписи
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/upload-keystore.jks"
          {
            echo "storeFile=$RUNNER_TEMP/upload-keystore.jks"
            echo "storePassword=$KS_PASS"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASS"
          } > android/key.properties
      - name: Сборка AAB
        run: python tool/release/build.py android
      - name: Убрать ключ
        if: ${{ always() }}
        run: rm -f android/key.properties "$RUNNER_TEMP/upload-keystore.jks"
      - name: Загрузка в Google Play
        env:
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          pip install --quiet google-api-python-client google-auth
          extra=()
          if [ "${{ inputs.listing }}" = "true" ]; then extra=(--listing --images); fi
          python tool/release/play.py dist/*.aab --track "${{ inputs.track }}" "${extra[@]}"
      - uses: actions/upload-artifact@v4
        if: ${{ always() }}
        with:
          name: google-play
          path: dist/
          retention-days: 14
